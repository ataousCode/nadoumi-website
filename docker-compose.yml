services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: nadoumi-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nadoumi
    volumes:
      - mongodb_data:/data/db
    networks:
      - nadoumi-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/nadoumi --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # MailDev - Email Testing Tool (Development)
  maildev:
    image: maildev/maildev:latest
    container_name: nadoumi-maildev
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP port
      - "1080:1080"  # Web UI port
    networks:
      - nadoumi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1080"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local

networks:
  nadoumi-network:
    driver: bridge

